<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rural Infrastructure Problem Analyzer — SDG 9</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #111;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 14px;
    padding: 2rem;
  }
  .header { border-bottom: 1px solid #e0e0e0; padding-bottom: 1.2rem; margin-bottom: 1.5rem; }
  .header h1 { font-size: 20px; font-weight: 600; color: #111; }
  .header p { font-size: 13px; color: #666; margin-top: 5px; line-height: 1.5; }
  .sdg-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; padding: 4px 12px;
    border-radius: 99px; border: 1px solid #333;
    color: #333; margin-top: 10px; letter-spacing: .03em;
  }
  .section-label {
    font-size: 11px; font-weight: 600; color: #999;
    letter-spacing: .07em; text-transform: uppercase; margin-bottom: 8px;
  }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  select, textarea {
    width: 100%; background: #fff; border: 1px solid #ccc;
    border-radius: 8px; color: #111; font-size: 13px;
    padding: 9px 11px; font-family: inherit; transition: border-color .15s;
  }
  select:focus, textarea:focus { outline: none; border-color: #555; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ex-btn {
    font-size: 12px; padding: 4px 11px; border: 1px solid #ccc;
    border-radius: 99px; background: transparent; color: #555;
    cursor: pointer; font-family: inherit; transition: background .12s;
  }
  .ex-btn:hover { background: #f0f0f0; }
  .ex-label { font-size: 12px; color: #aaa; margin-top: 10px; display: block; }
  .analyze-btn {
    width: 100%; margin-top: 14px; padding: 11px;
    font-size: 14px; font-weight: 600; background: #111; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity .15s; font-family: inherit;
  }
  .analyze-btn:hover { opacity: .85; }
  .analyze-btn:disabled { opacity: .4; cursor: not-allowed; }
  .result-card {
    background: #fff; border: 1px solid #e0e0e0;
    border-radius: 12px; padding: 1.25rem; margin-top: 18px;
  }
  .result-section { margin-bottom: 14px; }
  .result-section:last-child { margin-bottom: 0; }
  .result-section h3 {
    font-size: 12px; font-weight: 600; color: #111;
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 7px; display: flex; align-items: center; gap: 6px;
  }
  .result-section p { font-size: 13px; color: #444; line-height: 1.65; }
  hr.divider { border: none; border-top: 1px solid #f0f0f0; margin: 14px 0; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    font-size: 12px; padding: 3px 11px; border-radius: 99px;
    border: 1px solid #ddd; color: #555; background: #fafafa;
  }
  .sol-item {
    margin-bottom: 10px; padding: 11px 13px;
    border: 1px solid #e8e8e8; border-radius: 8px;
  }
  .sol-item:last-child { margin-bottom: 0; }
  .sol-title { font-size: 12px; font-weight: 600; color: #111; margin-bottom: 4px; }
  .sol-desc { font-size: 13px; color: #555; line-height: 1.55; }
  .loading-dots { display: inline-flex; gap: 4px; align-items: center; }
  .loading-dots span {
    width: 5px; height: 5px; border-radius: 50%; background: #fff;
    animation: blink 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: .2s; }
  .loading-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  .error-msg {
    font-size: 13px; color: #a00; background: #fff5f5;
    border: 1px solid #fcc; border-radius: 8px;
    padding: 10px 14px; margin-top: 12px;
  }
  .impact-box {
    background: #f7f7f7; border-radius: 8px;
    padding: 11px 13px; font-size: 13px; color: #333; line-height: 1.6;
  }
  @media (max-width: 500px) {
    .input-row { grid-template-columns: 1fr; }
    .container { padding: 1.25rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Rural Infrastructure Problem Analyzer</h1>
    <p>Describe a rural infrastructure challenge — get AI-powered analysis, root causes &amp; actionable solutions aligned with SDG 9.</p>
    <span class="sdg-badge">&#9632; SDG 9 — Industry, Innovation &amp; Infrastructure</span>
  </div>

  <div class="section-label">Village / region context</div>
  <div class="input-row">
    <select id="region-type">
      <option value="">Region type</option>
      <option>Hilly / remote area</option>
      <option>Flood-prone area</option>
      <option>Coastal village</option>
      <option>Semi-urban fringe</option>
      <option>Agricultural plains</option>
      <option>Tribal / forest area</option>
    </select>
    <select id="infra-type">
      <option value="">Infrastructure type</option>
      <option>Road &amp; transport</option>
      <option>Electricity &amp; energy</option>
      <option>Water &amp; sanitation</option>
      <option>Digital connectivity</option>
      <option>Healthcare facility</option>
      <option>School / education</option>
      <option>Market / cold storage</option>
    </select>
  </div>

  <div class="section-label">Describe the problem</div>
  <textarea id="problem-desc" placeholder="e.g. Our village has no paved road. During monsoon, students cannot reach school and farmers cannot transport crops to market. The unpaved road gets flooded every year..."></textarea>

  <span class="ex-label">Quick examples:</span>
  <div class="examples">
    <button class="ex-btn" onclick="fillExample(0)">No road in flood season</button>
    <button class="ex-btn" onclick="fillExample(1)">No electricity for 12 hrs</button>
    <button class="ex-btn" onclick="fillExample(2)">No internet in school</button>
    <button class="ex-btn" onclick="fillExample(3)">Farmers lack cold storage</button>
  </div>

  <button class="analyze-btn" id="analyze-btn" onclick="analyze()">
    &#9632; Analyze with AI
  </button>

  <div id="output"></div>
</div>

<script>
const examples = [
  {region:"Flood-prone area",infra:"Road & transport",desc:"Our village has no paved road. Every monsoon the mud road becomes impassable for 3-4 months. Students cannot reach school, patients cannot get to hospital, and farmers lose crops worth lakhs because they cannot transport produce to market. The government has promised a road for 10 years but nothing has happened."},
  {region:"Agricultural plains",infra:"Electricity & energy",desc:"We get electricity for only 8-10 hours a day. Farmers cannot run irrigation pumps at night, small shops close early, students cannot study after dark. The transformer breaks every summer when load is high and takes 2 weeks to repair. Solar is too expensive for individual households."},
  {region:"Hilly / remote area",infra:"Digital connectivity",desc:"Our school has no internet connection. Teachers cannot access digital teaching materials. Students preparing for competitive exams have no access to online resources. The nearest town with internet is 25 km away. Only one telecom tower serves our entire panchayat and signal is very weak."},
  {region:"Agricultural plains",infra:"Market / cold storage",desc:"Our village produces large quantities of vegetables and fruits but there is no cold storage within 60 km. Farmers are forced to sell at throwaway prices to middlemen immediately after harvest. Every year 30-40% of produce rots before reaching market. Farmers remain poor despite high production."}
];

function fillExample(i) {
  const e = examples[i];
  document.getElementById('region-type').value = e.region;
  document.getElementById('infra-type').value = e.infra;
  document.getElementById('problem-desc').value = e.desc;
}

async function analyze() {
  const region = document.getElementById('region-type').value;
  const infra = document.getElementById('infra-type').value;
  const desc = document.getElementById('problem-desc').value.trim();

  if (!desc) {
    document.getElementById('output').innerHTML = '<div class="error-msg">Please describe the infrastructure problem first.</div>';
    return;
  }

  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>&nbsp; Analyzing...';
  document.getElementById('output').innerHTML = '';

  const prompt = `You are an expert in rural infrastructure development and SDG 9 (Industry, Innovation, and Infrastructure). Analyze the following rural infrastructure problem and provide a structured response.

Context:
- Region type: ${region || 'Not specified'}
- Infrastructure domain: ${infra || 'Not specified'}
- Problem description: ${desc}

Respond ONLY in this exact JSON format (no markdown, no extra text):
{
  "problem_summary": "One clear sentence summarizing the core problem",
  "root_causes": ["cause 1", "cause 2", "cause 3"],
  "impact": "2-3 sentences on how this affects the community economically and socially",
  "solutions": [
    {"title": "Short-term (0-6 months)", "description": "Immediate actionable step"},
    {"title": "Medium-term (6-24 months)", "description": "Infrastructure intervention"},
    {"title": "Long-term (2-5 years)", "description": "Sustainable systemic solution"}
  ],
  "innovation_angle": "One innovative technology or approach (IoT, solar, AI, mobile apps etc.) that could help",
  "sdg9_alignment": "How this solution aligns with SDG 9 targets",
  "stakeholders": ["stakeholder 1", "stakeholder 2", "stakeholder 3"],
  "estimated_impact": "Quantified potential impact if solution is implemented"
}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await res.json();
    const text = data.content.map(c => c.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const r = JSON.parse(clean);

    document.getElementById('output').innerHTML = `
<div class="result-card">
  <div class="result-section">
    <h3>&#9632; Problem summary</h3>
    <p>${r.problem_summary}</p>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Root causes</h3>
    <div class="tag-row">${r.root_causes.map(c => `<span class="tag">${c}</span>`).join('')}</div>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Community impact</h3>
    <p>${r.impact}</p>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Solutions roadmap</h3>
    ${r.solutions.map(s => `<div class="sol-item"><div class="sol-title">${s.title}</div><div class="sol-desc">${s.description}</div></div>`).join('')}
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Innovation angle</h3>
    <p>${r.innovation_angle}</p>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; SDG 9 alignment</h3>
    <p>${r.sdg9_alignment}</p>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Key stakeholders</h3>
    <div class="tag-row">${r.stakeholders.map(s => `<span class="tag">${s}</span>`).join('')}</div>
  </div>
  <hr class="divider">
  <div class="result-section">
    <h3>&#9632; Estimated impact</h3>
    <div class="impact-box">${r.estimated_impact}</div>
  </div>
</div>`;

  } catch (e) {
    document.getElementById('output').innerHTML = `<div class="error-msg">&#9888; Analysis failed. Please check your connection and try again.</div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '&#9632; Analyze with AI';
}
</script>

</body>
</html>
